# The 7-day cooldown keeps a freshly compromised release out of a PR until the
# ecosystem has had time to notice. Security updates bypass the cooldown.
# Nothing auto-merges.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Minor and patch bumps travel together; a major bump gets its own PR.
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # eframe follows vino-user-interface's egui; bump them together by hand.
    ignore:
      - dependency-name: eframe
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: egui_kittest
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Actions stay pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
