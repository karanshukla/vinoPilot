name: Release

# Push a tag like v0.1.0 to publish a release with prebuilt binaries (a
# tarball, a .deb, an .rpm and a Flatpak bundle of the same two), then (after
# approval) the three crates to crates.io and the terminal UI to PyPI.
#
# Jobs are split by permission. `build` and `flatpak` hold no write token.
# `attest` holds only the OIDC and attestation scopes needed to sign build
# provenance. `publish` holds `contents: write` and never builds, so the
# bytes attached to the release are exactly the ones that were attested.
# Verify with (the .deb, .rpm and .flatpak the same way):
#
#   gh attestation verify vinopilot-x86_64-linux.tar.gz --repo karanshukla/vinopilot
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    # The oldest runner: the window links glibc (package-release.sh says why).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main and has a changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }
          # git cliff writes "## [0.1.0] - 2026-11-06" for the tag v0.1.0.
          awk -v t="[${TAG#v}]" '$0 ~ "^## " { on = index($0, "## " t) == 1; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## [${TAG#v}]' section"; exit 1; }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Check the tag matches every crate's version
        run: |
          cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u > versions
          test "$(cat versions)" = "${GITHUB_REF_NAME#v}" || { echo "tag $GITHUB_REF_NAME, crates $(tr '\n' ' ' < versions)" >&2; exit 1; }
          tui="$(sed -n 's/^version = "\(.*\)"$/\1/p' tui/pyproject.toml | head -1)"
          test "$tui" = "${GITHUB_REF_NAME#v}" || { echo "tag $GITHUB_REF_NAME, tui/pyproject.toml $tui" >&2; exit 1; }
      # The tag's CI run may not have finished, so test the tagged tree here too.
      - run: cargo test --locked --workspace
      # rpmbuild, for the .rpm; dpkg-deb is already there.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Build and package
        run: |
          .github/package-release.sh
          cp notes.md dist/
      - name: Smoke-test the tarball, the .deb and the .rpm
        run: |
          tests/release-smoke.sh dist "${GITHUB_REF_NAME#v}"
          tests/package-install.sh dist "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            dist/install.sh
            dist/notes.md
          if-no-files-found: error

  # The Flatpak bundle, around the binaries `build` made: a newer runner than
  # theirs, for a Flatpak that knows the current runtime. It passes on
  # everything `build` uploaded plus the bundle, as `dist`.
  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist
      - name: Install Flatpak
        run: |
          sudo apt-get update
          # librsvg2-common: flatpak-builder's appstream step reads the SVG icon with it.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils dbus-daemon librsvg2-common
          # Ubuntu 24.04 keeps bubblewrap, Flatpak's sandbox, from making its user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: .github/package-flatpak.sh dist
      - name: Smoke-test the Flatpak
        run: tests/flatpak-smoke.sh dist "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
            dist/SHA256SUMS
            dist/install.sh
            dist/notes.md
          if-no-files-found: error

  attest:
    needs: flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/vinopilot-x86_64-linux.tar.gz
            dist/vinopilot-x86_64.deb
            dist/vinopilot-x86_64.rpm
            dist/vinopilot-x86_64.flatpak
            dist/install.sh

  publish:
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file dist/notes.md dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.flatpak dist/install.sh dist/SHA256SUMS

  # Trusted publishing: crates.io trusts this workflow file, in this repo, in
  # the `crates-io` environment, so no API token exists anywhere. The
  # environment requires the maintainer's approval, so a pushed tag alone
  # cannot publish. Core first: the CLI and window depend on its version.
  crates-io:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish core, then the CLI and the window
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in vinopilot-core vinopilot vinopilot-gui; do
            cargo publish --locked -p "$crate"
          done

  # The same for PyPI: it trusts this workflow in the `pypi` environment, no
  # token. The sdist and wheel are built here from the tagged tree.
  pypi:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: uv publish --trusted-publishing always
