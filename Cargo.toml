[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/karanshukla/vinopilot"
homepage = "https://vinopilot.ca/"

[workspace.dependencies]
vinopilot-core = { path = "crates/core", version = "0.4.1" }
vino-ui = { package = "vino-user-interface", version = "0.4.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
